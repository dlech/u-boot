# SPDX-License-Identifier: GPL-2.0-or-later
#
# MediaTek U-Boot CI: build gate.
#
# Builds every commit on mediatek-staging that isn't already upstream (and
# isn't from mediatek-test-support itself, which reaches mediatek-staging
# only via a merge commit). Compile-only for now -- no flashing/hardware
# testing yet. Pick a "Target branch" in a manual run to gate a different
# branch (mediatek-for-next, mediatek-for-main) instead -- see below.
#
# Deploy: set this project's Settings -> CI/CD -> General pipelines ->
# "CI/CD configuration file" to .mediatek-ci/gitlab-ci.yml. Kept as
# a separate file (not a change to .gitlab-ci.yml) so it can never clobber
# upstream's own CI config and survives rebases cleanly.
#
# See .mediatek-ci/README.md for the full design (commit-range computation,
# board scope, why there's no persisted build-record).

# Pipeline inputs, so Build > Pipelines > Run pipeline offers these as named,
# self-describing form fields (a dropdown for the branch) instead of variables
# whose exact names have to be remembered. They only feed the variables below,
# so setting MTK_TARGET_BRANCH/MTK_KNOWN_GOOD as CI/CD variables by hand still
# works and still wins -- manual variables override the values set here.
spec:
  inputs:
    target_branch:
      description: >-
        Branch to build instead of the ref this pipeline runs on. Leave blank
        to build the pipeline's own ref (the normal mediatek-staging gate).
        mediatek-for-next/mediatek-for-main have no .mediatek-ci/ of their own,
        so they can only be built this way.
      default: ""
      options: [ "", "mediatek-for-next", "mediatek-for-main" ]
    known_good:
      description: >-
        Optional commit already known to build clean; it and everything it
        reaches are skipped. Must be an ancestor of what's being built. Useful
        with a target branch, where GitLab's own known-good SHAs describe the
        wrong ref and every run would otherwise rebuild the whole stack.
      default: ""
---

variables:
  MTK_UPSTREAM_URL:     "https://git.u-boot-project.org/u-boot/u-boot.git"
  MTK_UPSTREAM_REMOTE:  "mtk-upstream"
  MTK_UPSTREAM_REFS:    "main next"
  MTK_STAGING_BRANCH:   "mediatek-staging"
  MTK_TEST_SUPPORT_REF: "mediatek-test-support"
  MTK_BUILDMAN_TERMS:   "mediatek mt7628"
  # Branch to build instead of the pipeline's own ref. Empty (the default)
  # means "build the ref this pipeline ran on". Set it via the "Target branch"
  # input of a manual "Run pipeline" to gate a branch that can't host a
  # pipeline of its own -- mediatek-for-next/mediatek-for-main carry nothing
  # but what goes upstream, so they have no .mediatek-ci/ for GitLab to read a
  # config from. In that mode the pipeline's own ref supplies only
  # .mediatek-ci/; everything built comes from the target branch. See
  # .mediatek-ci/README.md.
  MTK_TARGET_BRANCH:    "$[[ inputs.target_branch ]]"
  # A commit already built clean, skipped along with its ancestors. Read
  # directly by build_gate.py; empty means "use GitLab's own known-good SHA,
  # if this pipeline has a meaningful one".
  MTK_KNOWN_GOOD:       "$[[ inputs.known_good ]]"
  # Where .mediatek-ci/ is stashed before the target-branch checkout below
  # removes it from the worktree.
  MTK_CI_DIR:           "/tmp/mtk-ci"
  # Full, unshallow clone: the commit-range computation below needs real
  # history on both sides to find where mediatek-staging actually diverges
  # from upstream main/next, and a too-shallow clone would silently produce
  # a *wrong* set rather than erroring. Revisit once a safe minimum depth is
  # confirmed.
  GIT_DEPTH:             "0"
  WERROR:                "0"

stages: [ build ]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $MTK_STAGING_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# The pinned U-Boot CI runner image (cross-toolchains + buildman). Bump deliberately.
.mtk_image: &mtk_image trini/u-boot-gitlab-ci-runner:noble-20251013-23Jan2026

mediatek build:
  stage: build
  image: *mtk_image
  # No tags: -- run on any available runner.
  # A force-push/rebase of mediatek-staging invalidates CI_COMMIT_BEFORE_SHA
  # (see build_gate.py's resolve_known_good()), so the whole un-upstreamed
  # stack rebuilds from scratch. build_gate.py batches contiguous runs of
  # commits together to keep this fast, but a very large stack can still
  # take a while -- give it more room than the project default.
  timeout: 2h
  before_script:
    # The Docker executor's checkout is owned by a different UID than the
    # container runs as, so git refuses to touch it until told it's safe.
    - git config --global --add safe.directory "${CI_PROJECT_DIR}"
    # Stash the CI code outside the worktree: the target-branch checkout below
    # replaces the worktree with a branch that has no .mediatek-ci/. Done
    # unconditionally so both modes run the exact same command.
    - rm -rf "${MTK_CI_DIR}" && cp -a .mediatek-ci "${MTK_CI_DIR}"
    - git remote add "${MTK_UPSTREAM_REMOTE}" "${MTK_UPSTREAM_URL}" 2>/dev/null || true
    - >
      for ref in ${MTK_UPSTREAM_REFS}; do
        git fetch --no-tags "${MTK_UPSTREAM_REMOTE}" "+refs/heads/${ref}:refs/remotes/${MTK_UPSTREAM_REMOTE}/${ref}";
      done
    - git fetch --no-tags origin "+refs/heads/${MTK_TEST_SUPPORT_REF}:refs/remotes/origin/${MTK_TEST_SUPPORT_REF}"
    # Target-branch mode: build a branch other than the one this pipeline ran
    # on. Every before_script/script line shares one shell, so the export and
    # unset below carry through to build_gate.py.
    - |
      if [ -n "${MTK_TARGET_BRANCH}" ]; then
        git fetch --no-tags origin "+refs/heads/${MTK_TARGET_BRANCH}:refs/remotes/origin/${MTK_TARGET_BRANCH}"
        git checkout --detach "refs/remotes/origin/${MTK_TARGET_BRANCH}"
        # Without this, build_gate.py's resolve_target() falls back to
        # CI_COMMIT_SHA, which is the pipeline's own ref, not the target.
        export MTK_TARGET_REF="refs/remotes/origin/${MTK_TARGET_BRANCH}"
        # Both describe the pipeline's own ref, so neither says anything about
        # what has already been built on the target branch.
        unset CI_COMMIT_BEFORE_SHA CI_MERGE_REQUEST_DIFF_BASE_SHA
      fi
  script:
    - python3 "${MTK_CI_DIR}/scripts/build_gate.py"
  artifacts:
    when: always
    paths: [ build-summary.txt ]
    expire_in: 1 week
