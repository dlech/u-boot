%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/mediatek,mt8366-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek Functional Clock Controller for MT8366

maintainers:
  - Markus Schneider-Pargmann <msp@baylibre.com>

properties:
  compatible:
    items:
      - enum:
          - mediatek,mt8366-camsys-main
          - mediatek,mt8366-dptx
          - mediatek,mt8366-ipesys
          - mediatek,mt8366-vdec-gcon
          - mediatek,mt8366-epdsys
          - mediatek,mt8366-infracfg-ao
      - const: syscon

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@1a000000 {
        compatible = "mediatek,mt8366-camsys-main", "syscon";
        reg = <0x1a000000 0x1000>;
        #clock-cells = <1>;
    };
